name: DwarfStar
options:
  bundleIdPrefix: com.dwarfstar
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
# Reference-only groups shown in the Xcode navigator, NOT compiled into any
# target. metal/*.metal is the source of truth for the GPU kernels: they are
# embedded as strings in Sources/DS4Metal/Runtime/Generated/KernelSources.swift by
# `make embed-kernels` and compiled at app launch, so they must never be added
# to a target's sources (Xcode would build a competing default.metallib).
fileGroups:
  - metal
settings:
  base:
    SWIFT_VERSION: "6.0"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    # Apple Silicon ONLY. The engine requires unified-memory Metal and uses
    # Float16 (unavailable on macOS x86_64): building the Intel slice fails
    # with misleading errors ("Float16 has no member bitPattern"). Pin arm64
    # so "Any Mac" destinations and Archive never try x86_64.
    ARCHS: arm64
    EXCLUDED_ARCHS: x86_64
    ONLY_ACTIVE_ARCH: YES
    # Pure-Swift modules have no Obj-C interop, so no -Swift.h is generated;
    # disable the "Copy Swift Obj-C Interface Header" install phase (it would
    # otherwise fail looking for a missing header).
    SWIFT_INSTALL_OBJC_HEADER: "NO"

# Pure-Swift multi-model stack — NO external links (no C engine, no prebuilt
# static lib). DeepSeek V4 Flash and the single-file Pro Q2 profile are
# operational locally through one geometry-driven backend; Pro Q4 split loading
# is not implemented. GLM 5.2 has an isolated detector/frontend and staged
# kernels but no executable decoder; Qwen has a recognized placeholder. The SwiftUI app
# (DwarfStar) is driven by DS4Engine -> DS4Core + DS4Metal, so the whole thing
# builds in this .xcodeproj.
targets:
  DS4Core:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DS4Core
        excludes: ["**/*.md", "*.md"]

  DS4Metal:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DS4Metal
        excludes: ["**/*.md", "*.md"]
    dependencies:
      - target: DS4Core
      - sdk: Metal.framework

  DS4Engine:
    type: library.static
    platform: macOS
    sources:
      - path: Sources/DS4Engine
        excludes: ["**/*.md", "*.md"]
    dependencies:
      - target: DS4Core
      - target: DS4Metal
      - sdk: Metal.framework

  DS4Demo:
    type: tool
    platform: macOS
    sources:
      - path: Sources/DS4Demo
        excludes: ["**/*.md", "*.md"]
    dependencies:
      - target: DS4Core
      - target: DS4Metal
      - sdk: Metal.framework

  DS4SWEBenchLocal:
    type: tool
    platform: macOS
    sources:
      - path: Sources/DS4SWEBenchLocal

  # Unit tests for the pure-Swift engine — mirrors the SwiftPM DS4CoreTests
  # target so `swift test` and the Xcode test action exercise the same files.
  # A logic-test bundle (no host app): it links the static engine libraries and
  # @testable-imports them (Debug builds enable testability). Metal kernel tests
  # still self-skip unless their (currently hardcoded) metalDir exists.
  DS4CoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/DS4CoreTests
        excludes: ["**/*.md", "*.md"]
    dependencies:
      - target: DS4Core
      - target: DS4Metal
      - target: DS4Engine
      - sdk: Metal.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dwarfstar.tests
        # Codeless/logic test bundle — no signing identity needed locally.
        CODE_SIGN_STYLE: Automatic

  DwarfStar:
    type: application
    platform: macOS
    sources:
      - path: Sources/DwarfStar
        excludes: ["**/*.md", "*.md"]
    dependencies:
      - target: DS4SWEBenchLocal
      - target: DS4Engine
      - target: DS4Core
      - target: DS4Metal
      - sdk: Metal.framework
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.dwarfstar.app
        INFOPLIST_KEY_CFBundleDisplayName: DwarfStar
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        # Export compliance: the app uses only EXEMPT encryption (HTTPS/TLS via
        # the OS for downloads) + hashing (SHA-1 for KV-cache filenames, SHA-256
        # for downloaded-model integrity — not encryption). No proprietary crypto.
        # See docs/CRITTOGRAFIA.md. NO = no annual self-classification report.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        # Local-network privacy (macOS 15+): without this usage description the
        # system can silently deny LAN traffic — distributed inference (worker/
        # coordinator on LAN Macs) and the HTTP server would fail. macOS shows a
        # one-time consent prompt with this text.
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "DwarfStar usa la rete locale per l'inferenza distribuita (coordinatore e worker sui Mac della LAN) e per esporre il server HTTP locale."
        MARKETING_VERSION: "1.0"
        # Build number: `make xcodeproj` increments this in-place before xcodegen.
        CURRENT_PROJECT_VERSION: "30"
        INFOPLIST_KEY_LSMinimumSystemVersion: "14.0"
        CODE_SIGN_STYLE: Automatic
        # Signing team (set once here: the .xcodeproj is REGENERATED by
        # `make xcodeproj`, so a team chosen in the Xcode UI would be lost).
        DEVELOPMENT_TEAM: U4V89TP978
        ENABLE_HARDENED_RUNTIME: YES
        # Wire the manually-added AppIcon + entitlements so `make xcodeproj`
        # regenerates losslessly. The Assets.xcassets catalog under
        # Sources/DwarfStar is auto-detected by xcodegen.
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: packaging/DwarfStar.entitlements

# Keep Xcode Run on Release: model generation in Debug is materially slower.
# Tests remain Debug so @testable imports and diagnostics are available.
schemes:
  DwarfStar:
    build:
      targets:
        DwarfStar: all
    run:
      config: Release
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - DS4CoreTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
